name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  host-unit-tests:
    name: Host Unit Tests & Parser Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Build & Run C Unit Tests
        run: |
          make -C host/tests

      - name: Run Python Log Parser Tests
        run: |
          python3 host/parser/test_parser.py

  static-analysis:
    name: Static Analysis & Code Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Static Analysis Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --error-exitcode=1 \
                   --enable=warning,style,performance,portability \
                   --suppress=missingIncludeSystem \
                   --inline-suppr \
                   -I firmware/app/common \
                   -I firmware/app/tasks \
                   -I firmware/app/fault \
                   -I firmware/app/drivers \
                   firmware/app/common firmware/app/tasks
